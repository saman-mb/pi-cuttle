# Self-hosted GitHub Actions runner for pi-cuttle — Docker setup
#
# Runs the runner as a Linux container on the host that can reach the classifier.
# The container reaches the native llama.cpp server via host.docker.internal, so the
# model keeps host GPU acceleration while the runner stays containerized.
#
# Setup:
#   1. Create a GitHub PAT with `repo` scope (Settings → Developer settings → Tokens).
#      A PAT — not an expiring registration token — is what lets the runner re-register
#      automatically after a restart.
#   2. Put it in .env next to this file:  GITHUB_PAT=ghp_...
#   3. docker compose up -d --build
#
# The runner registers itself as: self-hosted, Linux, ARM64, eval
# Workflows target it with:      runs-on: [self-hosted, Linux, ARM64, eval]

services:
  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    image: github-runner-pi-cuttle:latest
    container_name: pi-cuttle-runner
    restart: always
    environment:
      - REPO_SLUG=saman-mb/pi-cuttle
      - RUNNER_NAME=pi-cuttle-runner
      - ACCESS_TOKEN=${GITHUB_PAT}
      - RUNNER_WORKDIR=/tmp/runner-work
      # GitHub normalizes these to Linux,ARM64; keep them in sync with the workflow.
      - LABELS=self-hosted,linux,arm64,eval
      - RUNNER_NO_UPDATE=1
      # The container runs as root; the runner refuses that unless this is set.
      - RUNNER_ALLOW_RUNASROOT=1
    extra_hosts:
      # Lets the container reach the native llama.cpp server on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - runner-work:/tmp/runner-work
      # The eval reads the classifier ref from ~/.pi/agent/pi-cuttle.json. HOME is
      # /root in the container, so mount the host's config there (read-only).
      # Without this the live eval exits 1 with "no classifier is configured".
      - ${HOME}/.pi/agent/pi-cuttle.json:/root/.pi/agent/pi-cuttle.json:ro

volumes:
  runner-work:
