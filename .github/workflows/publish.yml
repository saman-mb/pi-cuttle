name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (latest, next, etc.)"
        required: false
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - name: Use npm with trusted-publishing support
        run: npm install -g npm@latest

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json is $PKG_VERSION, release tag is $TAG_VERSION"
            exit 1
          fi

      - run: npm test
      - run: npm run typecheck

      - name: Check if code changed
        id: check
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME#v}" | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "reason=first release" >> $GITHUB_OUTPUT
          else
            DIFF_FILES=$(git diff "$PREV_TAG" HEAD --name-only)
            CODE_FILES=$(echo "$DIFF_FILES" | grep -vE "^(docs/|README\.md|CHANGELOG\.md|LICENSE|docs/badges/|docs/assets/)" || true)
            if [ -z "$CODE_FILES" ]; then
              echo "publish=false" >> $GITHUB_OUTPUT
              echo "reason=docs-only change" >> $GITHUB_OUTPUT
            else
              echo "publish=true" >> $GITHUB_OUTPUT
              echo "reason=code changed" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public --tag "${{ github.event.inputs.tag || 'latest' }}"

      - name: Skip publish (docs only)
        if: steps.check.outputs.publish == 'false'
        run: echo "Skipping npm publish — only docs changed since previous release"
