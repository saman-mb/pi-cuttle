name: Publish to npm

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (latest, next, etc.)"
        required: false
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - name: Use npm with trusted-publishing support
        run: npm install -g npm@latest

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json is $PKG_VERSION, release tag is $TAG_VERSION"
            exit 1
          fi

      - run: npm test
      - run: npm run typecheck

      - name: Decide whether to publish
        id: check
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "push" ]; then
            PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
            CURR_VERSION=$(node -p "require('./package.json').version")
            if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" = "$CURR_VERSION" ]; then
              echo "publish=false" >> $GITHUB_OUTPUT
              echo "reason=package.json version unchanged" >> $GITHUB_OUTPUT
            else
              echo "publish=true" >> $GITHUB_OUTPUT
              echo "reason=version bumped to $CURR_VERSION" >> $GITHUB_OUTPUT
            fi
          else
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "reason=$EVENT" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public --tag "${{ github.event.inputs.tag || 'latest' }}"

      - name: Skip publish
        if: steps.check.outputs.publish == 'false'
        run: echo "Skipping npm publish — ${{ steps.check.outputs.reason }}"
